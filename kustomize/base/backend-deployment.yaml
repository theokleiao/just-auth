apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      component: backend
  template:
    metadata:
      labels:
        component: backend
    spec:
      containers:
      - name: backend
        image: backend-image
        ports:
        - containerPort: 7777
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: just-auth-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: just-auth-config
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: just-auth-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: just-auth-secret
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: just-auth-config
              key: DB_NAME
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: just-auth-secret
              key: JWT_SECRET
        - name: JWT_COOKIE_NAME
          valueFrom:
            configMapKeyRef:
              name: just-auth-config
              key: JWT_COOKIE_NAME
        - name: CORS_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: just-auth-config
              key: CORS_ORIGIN
      imagePullSecrets:
      - name: ghcr-secret