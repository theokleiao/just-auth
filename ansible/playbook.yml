- name: Deploy Just-Auth on EC2
  hosts: all
  become: yes
  vars:
    ghcr_username: "fykio"                 # Your GitHub username
    ghcr_token: "..."                      # You should use Ansible Vault for production
    project_dir: /home/ubuntu/just-auth

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Install Docker using convenience script
      shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: Install Docker Compose (standalone)
      get_url:
        url: https://github.com/docker/compose/releases/latest/download/docker-compose-Linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes
      become: yes

    - name: Create project directory
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Copy docker-compose.yml
      copy:
        src: docker-compose.yml
        dest: "{{ project_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu

    - name: Copy .env file
      copy:
        src: .env
        dest: "{{ project_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: Install pip3
      apt:
        name: python3-pip
        state: present

    - name: Install Docker SDK for Python
      apt:
        name: python3-docker
        state: present

    - name: Reset SSH connection to apply group changes
      meta: reset_connection

    - name: Log in to GHCR
      docker_login:
        registry_url: https://ghcr.io
        username: "{{ ghcr_username }}"
        password: "{{ ghcr_token }}"
        reauthorize: yes
      become: yes

    - name: Install docker-compose v1 (legacy) for Ansible module
      apt:
        name: docker-compose
        state: present

    - name: Start containers with docker-compose
      docker_compose:
        project_src: "{{ project_dir }}"
        state: present
        restarted: yes
      become: yes

    - name: Wait for frontend container to be healthy
      wait_for:
        port: 8888
        host: "{{ ansible_host }}"
        delay: 5
        timeout: 120

    - name: Display Frontend access URL
      debug:
        msg: "✅ JustAuth Frontend is running at http://{{ ansible_host }}:8888"
